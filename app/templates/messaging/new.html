{% extends "base.html" %}

{% block title %}New message — {{ school_name }}{% endblock %}

{% block content %}
<section class="dsa-section">
  <div class="container" style="max-width: 720px;">
    <a href="{{ url_for('messaging.inbox') }}" class="btn dsa-btn-ghost mb-3">← Back to inbox</a>

    <div class="dsa-card">
      <span class="dsa-eyebrow">Support</span>
      <h1 class="dsa-h1 mt-2">Send a message to the school office</h1>
      <p class="dsa-section-sub">
        The ICT lead checks messages every working day. You'll get a
        reply to your registered email.
      </p>

      <form method="post" novalidate class="mt-3">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="mb-3">
          <label class="form-label">Subject</label>
          <input type="text" name="subject" class="form-control" required
                 placeholder="e.g. How do I reset my PIN?">
        </div>

        <div class="mb-3">
          <label class="form-label">Message</label>
          <textarea name="body" class="form-control" rows="6" required
                    placeholder="Describe your question or concern..."></textarea>
        </div>

        <button type="submit" class="btn dsa-btn-primary">Send message</button>
      </form>
    </div>
  </div>
</section>
{% endblock %}
