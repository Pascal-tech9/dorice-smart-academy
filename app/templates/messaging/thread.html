{% extends "base.html" %}

{% block title %}Thread — {{ school_name }}{% endblock %}

{% block content %}
<section class="dsa-section">
  <div class="container" style="max-width: 800px;">
    <a href="{{ url_for('messaging.inbox') }}" class="btn dsa-btn-ghost mb-3">← Back</a>

    <h1 class="dsa-h1">{{ parent.subject }}</h1>

    <div class="dsa-thread">
      {% for m in replies %}
        <div class="dsa-msg {% if m.from_user_id == current_user.id %}dsa-msg-mine{% else %}dsa-msg-theirs{% endif %}">
          <div class="dsa-msg-meta">
            <strong>{{ m.from_user.full_name }}</strong>
            <small>{{ m.created_at.strftime('%Y-%m-%d %H:%M') }}</small>
          </div>
          <div class="dsa-msg-body">{{ m.body }}</div>
        </div>
      {% endfor %}
    </div>

    <form method="post" novalidate class="mt-3">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-2">
        <textarea name="body" class="form-control" rows="3" required
                  placeholder="Type your reply..."></textarea>
      </div>
      <button type="submit" class="btn dsa-btn-primary">Send reply</button>
    </form>
  </div>
</section>

<style>
.dsa-thread { margin-top: 16px; }
.dsa-msg {
  padding: 12px 16px; border-radius: 8px; margin-bottom: 8px;
  max-width: 80%;
}
.dsa-msg-mine {
  background: #E7F3EC; margin-left: auto; text-align: right;
}
.dsa-msg-theirs { background: #F5F2EA; }
.dsa-msg-meta { font-size: 12px; color: var(--ink-soft); margin-bottom: 4px; }
.dsa-msg-meta strong { margin-right: 8px; }
.dsa-msg-body { white-space: pre-wrap; font-size: 14.5px; }
</style>
{% endblock %}
