name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  validate:
    name: Typecheck, Lint, Tests & Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Typecheck
        run: npx tsc --noEmit

      - name: Run Lint
        run: npm run lint

      - name: Run Design Token & Contrast Checks
        run: npm run test:tokens

      - name: Run Row Level Security (RLS) Policy Verification
        run: npm run test:rls
