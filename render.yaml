# Render Blueprint for Dorice Smart Academy
# https://render.com/docs/blueprint-spec
#
# How to use:
#   1. Push this repo to GitHub
#   2. In Render, click "New" → "Blueprint" → point at this repo
#   3. Render reads render.yaml and provisions the web service + Postgres
#   4. Add the env vars listed under envVars in the Render dashboard
#   5. Deploy
#
# Pricing: Free tier covers the Web Service. Postgres free tier is
# 256MB / 90 days — upgrade to Starter ($7/mo) for production.

services:
  - type: web
    name: dorice-smart-academy
    runtime: python
    plan: starter
    branch: main
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
      python -c "from app import create_app; create_app()"
    startCommand: |
      gunicorn -w 2 -k gthread --threads 4 -b 0.0.0.0:$PORT \
        --access-logfile - --error-logfile - wsgi:app
    healthCheckPath: /healthz
    envVars:
      - key: FLASK_CONFIG
        value: production
      - key: SECRET_KEY
        generateValue: true
        description: "Auto-generated by Render. Used for session signing."
      - key: SCHOOL_ADMIN_EMAIL
        value: Doricesmartprimaryschool89@gmail.com
      - key: PYTHON_VERSION
        value: 3.11.2
      # ─── Database (auto-linked to the Postgres service below) ───
      - key: DATABASE_URL
        fromDatabase:
          name: dorice-db
          property: connectionString
      # ─── M-Pesa Daraja (sandbox first, production later) ───
      - key: MPESA_ENVIRONMENT
        value: sandbox
      - key: MPESA_SHORTCODE
        value: "400222"
      # MPESA_CONSUMER_KEY, MPESA_CONSUMER_SECRET, MPESA_PASSKEY,
      # MPESA_CALLBACK_URL — set these in the Render dashboard
      # after first deploy.
      # ─── Google OAuth (optional) ───
      # GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET,
      # GOOGLE_OAUTH_REDIRECT_URI — set in the dashboard
      # ─── School admin password (set in dashboard) ───
      # The seed creates Doricesmartprimaryschool89@gmail.com with
      # password 'demo123'. Change it immediately after first deploy.

databases:
  - name: dorice-db
    plan: starter
    databaseName: dorice
    user: dorice
